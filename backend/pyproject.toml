[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",   # FastAPI's Depends() in defaults is idiomatic
  "UP042",  # str+Enum keeps compatibility with SQLAlchemy string columns
  "B905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
